<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luckin — Growth &amp; Marketing</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#F8F7F2;
  --panel:#FFFFFF;
  --ink:#16211D;
  --ink-soft:#4B564F;
  --line:#1F4E5F;
  --accent:#3E8E7E;
  --hair:#E4E2D8;
  --radius:2px;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter', sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  word-wrap:break-word;
  overflow-wrap:break-word;
}

h1,h2,h3,.mono{font-family:'Space Grotesk', sans-serif;}
.mono{font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em;}

a{color:var(--line); text-decoration:none;}
a:hover{text-decoration:underline;}

.wrap{
  display:grid;
  grid-template-columns:64px 1fr;
  max-width:960px;
  margin:0 auto;
  padding:0 24px;
  min-width:0;
}

.rail{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.rail-line{
  position:absolute;
  top:14px; bottom:14px;
  width:2px;
  background:var(--hair);
}
.rail-line-fill{
  position:absolute;
  top:14px; left:0;
  width:2px;
  background:var(--line);
  transition:height .25s ease;
}
.stop{
  position:relative;
  width:100%;
  display:flex;
  justify-content:center;
}
.stop-dot{
  position:relative;
  z-index:2;
  width:12px; height:12px;
  border-radius:50%;
  background:var(--bg);
  border:2px solid var(--hair);
  margin-top:10px;
  transition:border-color .2s ease, background .2s ease, transform .2s ease;
}
.stop.active .stop-dot{
  border-color:var(--accent);
  background:var(--accent);
  transform:scale(1.15);
}

main{padding:64px 0 96px;}
section{padding:64px 0; border-bottom:1px solid var(--hair);}
section:last-of-type{border-bottom:none;}

/* ---------- Hero / About ---------- */
.hero{padding-top:24px;}
.hero-top{display:flex; gap:24px; align-items:flex-start; margin-bottom:26px; flex-wrap:wrap;}
.avatar{
  width:96px; height:96px; border-radius:50%;
  background:var(--line);
  color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk', sans-serif;
  font-size:32px; font-weight:600;
  overflow:hidden;
  flex-shrink:0;
  border:3px solid var(--panel);
  box-shadow:0 0 0 1px var(--hair);
}
.avatar img{width:100%; height:100%; object-fit:cover;}
.hero-heading{flex:1; min-width:220px;}
@media (max-width:640px){
  .hero-top{flex-direction:column; align-items:flex-start;}
  .hero-heading{min-width:0; width:100%;}
}
.eyebrow{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:0.12em;
  color:var(--accent);
  margin-bottom:10px;
}
.hero h1{
  font-size:clamp(30px, 4.5vw, 46px);
  font-weight:700;
  line-height:1.08;
  margin-bottom:8px;
}
.hero .role{
  font-size:16px;
  color:var(--ink-soft);
  margin-bottom:4px;
}
.social-row{display:flex; gap:10px; margin-top:14px;}
.icon-btn{
  width:34px; height:34px; border-radius:50%;
  border:1px solid var(--hair);
  display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft);
  font-size:14px;
  transition:border-color .2s ease, color .2s ease;
}
.icon-btn:hover{border-color:var(--accent); color:var(--accent); text-decoration:none;}

.about-label{font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--accent); margin-bottom:10px;}
.hero p.bio{max-width:600px; color:var(--ink-soft);}

.cta-row{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-top:24px;}
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:11px 20px;
  background:var(--line);
  color:#fff;
  border-radius:var(--radius);
  font-size:14px; font-weight:500;
  transition:background .2s ease;
}
.btn:hover{background:var(--ink); text-decoration:none;}
.btn.ghost{
  background:transparent; color:var(--ink); border:1px solid var(--hair);
}
.btn.ghost:hover{border-color:var(--line); color:var(--line); background:transparent;}

/* ---------- Section headers ---------- */
.sec-head{display:flex; align-items:baseline; gap:12px; margin-bottom:32px;}
.sec-num{font-size:12px; color:var(--accent);}
.sec-head h2{font-size:24px; font-weight:600;}

/* ---------- Experience ---------- */
.exp-item{margin-bottom:40px;}
.exp-item:last-child{margin-bottom:0;}
.exp-top{display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:2px;}
.exp-org{font-size:17px; font-weight:600;}
.exp-role{color:var(--accent); font-weight:500; font-style:italic;}
.exp-date{font-size:13px; color:var(--ink-soft); white-space:nowrap;}
.exp-loc{font-size:13px; color:var(--ink-soft); margin-bottom:10px;}
.exp-group-title{font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink); margin:14px 0 6px;}
.exp-item ul{margin-left:18px; color:var(--ink-soft);}
.exp-item li{margin-bottom:6px; font-size:14.5px;}

/* ---------- Projects: big cards ---------- */
.proj-stack{display:flex; flex-direction:column; gap:28px;}
.proj-card{
  display:block;
  background:var(--panel);
  border:1px solid var(--hair);
  border-radius:6px;
  overflow:hidden;
  color:var(--ink);
  transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
}
.proj-card:hover{border-color:var(--accent); transform:translateY(-2px); text-decoration:none;}
a.proj-card:hover{box-shadow:0 8px 24px rgba(22,33,29,0.08);}
.proj-media{
  width:100%;
  aspect-ratio:16/7;
  background:linear-gradient(135deg, var(--line), var(--accent));
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  position:relative;
}
.proj-media img{width:100%; height:100%; object-fit:cover; display:block;}
.proj-media.has-video{background:#0B0F0E; aspect-ratio:4/3;}
@media (max-width:640px){ .proj-media.has-video{aspect-ratio:3/4;} }
.proj-media.has-video video{width:100%; height:100%; object-fit:contain; display:block;}
.proj-media .placeholder-label{
  color:rgba(255,255,255,0.85);
  font-family:'Space Grotesk', sans-serif;
  font-size:15px;
  letter-spacing:0.04em;
  text-align:center;
  padding:0 20px;
}
.proj-body{padding:22px 24px 24px;}
.proj-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px;}
.proj-body h3{font-size:18px; font-weight:600;}
.proj-link-icon{flex-shrink:0; color:var(--accent); font-size:14px; transform:translateY(1px);}
.proj-body p{font-size:14.5px; color:var(--ink-soft); margin-bottom:14px; max-width:640px;}
.tag-row{display:flex; flex-wrap:wrap; gap:6px;}
.tag{
  font-size:11px;
  padding:3px 8px;
  background:var(--bg);
  border:1px solid var(--hair);
  border-radius:20px;
  color:var(--ink-soft);
}

/* ---------- Education ---------- */
.edu-item{margin-bottom:32px;}
.edu-item:last-child{margin-bottom:0;}
.edu-org{font-size:17px; font-weight:600; margin-bottom:2px;}
.edu-top{display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}
.edu-degree{color:var(--accent); font-weight:500; margin-bottom:4px;}
.edu-date{font-size:13px; color:var(--ink-soft);}
.edu-loc{font-size:13px; color:var(--ink-soft); margin-bottom:12px;}
.edu-note{color:var(--ink-soft); font-size:14px; max-width:640px;}
.edu-note + .edu-note{margin-top:8px;}

/* ---------- Contact ---------- */
.contact-grid{display:flex; flex-wrap:wrap; gap:28px;}
.contact-item .label{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:4px;}
.contact-item .value{font-size:15px; font-weight:500;}

footer{text-align:center; padding:32px 0; font-size:12px; color:var(--ink-soft);}

@media (max-width:640px){
  .wrap{grid-template-columns:28px 1fr; padding:0 16px;}
  .stop-dot{width:9px; height:9px;}
  .avatar{width:76px; height:76px; font-size:26px;}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="rail" id="rail">
    <div class="rail-line"></div>
    <div class="rail-line-fill" id="railFill"></div>
    <div class="stop" data-target="hero"><div class="stop-dot"></div></div>
    <div class="stop" data-target="experience"><div class="stop-dot"></div></div>
    <div class="stop" data-target="projects"><div class="stop-dot"></div></div>
  </div>

  <main id="content"></main>
</div>

<footer id="footer"></footer>

/* ============================================================

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function initials(name){
  return name.trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
}

function renderHero(data){
  const s = el("section","hero"); s.id = "hero";

  const top = el("div","hero-top");
  const avatar = el("div","avatar");
  if(data.photoUrl){
    const img = document.createElement("img");
    img.src = data.photoUrl; img.alt = data.name;
    avatar.appendChild(img);
  } else {
    avatar.textContent = initials(data.name);
  }

  const heading = el("div","hero-heading");
  const eyebrow = el("div","eyebrow","Profile");
  const h1 = el("h1", null, data.name);
  heading.append(eyebrow, h1);

  const socialRow = el("div","social-row");
  const emailContact = data.contact.find(c=>c.label === "Email");
  const linkedinContact = data.contact.find(c=>c.label === "LinkedIn");
  if(emailContact && emailContact.href){
    const a = el("a","icon-btn mono","✉");
    a.href = emailContact.href;
    socialRow.appendChild(a);
  }
  if(linkedinContact && linkedinContact.href && linkedinContact.href !== "#"){
    const a = el("a","icon-btn mono","in");
    a.href = linkedinContact.href; a.target = "_blank"; a.rel = "noopener";
    socialRow.appendChild(a);
  }
  if(socialRow.children.length) heading.appendChild(socialRow);

  top.append(avatar, heading);

  const aboutLabel = el("div","about-label","About");
  const p = el("p","bio", data.bio);

  const ctaRow = el("div","cta-row");
  if(data.resumeUrl){
    const btn = el("a","btn","Download Resume PDF ↓");
    btn.href = data.resumeUrl; btn.target = "_blank";
    ctaRow.appendChild(btn);
  } else {
    const btn = el("span","btn ghost","Resume PDF coming soon");
    ctaRow.appendChild(btn);
  }

  s.append(top, aboutLabel, p, ctaRow);
  return s;
}

function renderExperience(data){
  const s = el("section", null); s.id = "experience";
  const head = el("div","sec-head", `<span class="sec-num mono">01</span><h2>Experience</h2>`);
  s.appendChild(head);
  data.experience.forEach(exp=>{
    const item = el("div","exp-item");
    const top = el("div","exp-top", `
      <div><span class="exp-org">${exp.org}</span> — <span class="exp-role">${exp.role}</span></div>
      <div class="exp-date mono">${exp.date}</div>
    `);
    item.appendChild(top);
    if(exp.location){
      item.appendChild(el("div","exp-loc", exp.location));
    }
    if(exp.groups){
      exp.groups.forEach(g=>{
        item.appendChild(el("div","exp-group-title", g.subtitle));
        const ul = el("ul");
        g.bullets.forEach(b=> ul.appendChild(el("li", null, b)));
        item.appendChild(ul);
      });
    } else if(exp.bullets){
      const ul = el("ul");
      exp.bullets.forEach(b=> ul.appendChild(el("li", null, b)));
      item.appendChild(ul);
    }
    s.appendChild(item);
  });
  return s;
}

function renderProjects(data){
  const s = el("section", null); s.id = "projects";
  const head = el("div","sec-head", `<span class="sec-num mono">02</span><h2>Projects</h2>`);
  s.appendChild(head);
  const stack = el("div","proj-stack");
  data.projects.forEach(p=>{
    const hasLink = !!p.link;
    const card = el(hasLink ? "a" : "div", "proj-card");
    if(hasLink){ card.href = p.link; card.target = "_blank"; card.rel = "noopener"; }

    const media = el("div","proj-media");
    if(p.videoUrl){
      media.classList.add("has-video");
      const video = document.createElement("video");
      video.src = p.videoUrl;
      video.controls = true;
      video.muted = true;
      video.playsInline = true;
      video.preload = "metadata";
      media.appendChild(video);
    } else if(p.imageUrl){
      const img = document.createElement("img");
      img.src = p.imageUrl; img.alt = p.title;
      media.appendChild(img);
    } else {
      media.appendChild(el("div","placeholder-label", p.title));
    }

    const body = el("div","proj-body");
    const topRow = el("div","proj-top");
    topRow.appendChild(el("h3", null, p.title));
    if(hasLink) topRow.appendChild(el("span","proj-link-icon mono","↗"));
    const desc = el("p", null, p.desc);
    const tagRow = el("div","tag-row");
    p.tags.forEach(t=> tagRow.appendChild(el("span","tag", t)));
    body.append(topRow, desc, tagRow);

    card.append(media, body);
    stack.appendChild(card);
  });
  s.appendChild(stack);
  return s;
}

function renderEducation(data){
  const s = el("section", null); s.id = "education";
  const head = el("div","sec-head", `<span class="sec-num mono">03</span><h2>Education</h2>`);
  s.appendChild(head);
  data.education.forEach(edu=>{
    const item = el("div","edu-item");
    const top = el("div","edu-top", `
      <div class="edu-org">${edu.org}</div>
      <div class="edu-date mono">${edu.date}</div>
    `);
    item.appendChild(top);
    item.appendChild(el("div","edu-degree", edu.degree));
    if(edu.location) item.appendChild(el("div","edu-loc", edu.location));
    edu.notes.forEach(n=> item.appendChild(el("div","edu-note", n)));
    s.appendChild(item);
  });
  return s;
}

function renderContact(data){
  const s = el("section", null); s.id = "contact";
  const head = el("div","sec-head", `<span class="sec-num mono">04</span><h2>Contact</h2>`);
  s.appendChild(head);
  const grid = el("div","contact-grid");
  data.contact.forEach(c=>{
    const item = el("div","contact-item");
    const label = el("div","label", c.label);
    const value = c.href ? el("a","value", c.value) : el("div","value", c.value);
    if(c.href) value.href = c.href;
    item.append(label, value);
    grid.appendChild(item);
  });
  s.appendChild(grid);
  return s;
}

function render(){
  const content = document.getElementById("content");
  content.append(
    renderHero(PROFILE_DATA),
    renderExperience(PROFILE_DATA),
    renderProjects(PROFILE_DATA)
  );
  document.getElementById("footer").textContent =
    `${PROFILE_DATA.name} · Last updated ${new Date().toISOString().slice(0,10)}`;
}
render();

const stops = Array.from(document.querySelectorAll(".stop"));
const railFill = document.getElementById("railFill");
const rail = document.getElementById("rail");

stops.forEach(stop=>{
  stop.addEventListener("click", ()=>{
    const target = document.getElementById(stop.dataset.target);
    if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
  });
  stop.style.cursor = "pointer";
});

function updateRail(){
  const sections = stops.map(s=>document.getElementById(s.dataset.target));
  const scrollPos = window.scrollY + window.innerHeight * 0.3;
  let activeIndex = 0;
  sections.forEach((sec, i)=>{
    if(sec && sec.offsetTop <= scrollPos) activeIndex = i;
  });
  stops.forEach((s,i)=> s.classList.toggle("active", i === activeIndex));

  const railHeight = rail.offsetHeight - 28;
  const progress = activeIndex / (stops.length - 1);
  railFill.style.height = Math.max(0, railHeight * progress) + "px";
}
window.addEventListener("scroll", updateRail);
window.addEventListener("resize", updateRail);
updateRail();
</script>
